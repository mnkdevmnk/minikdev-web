<!doctype html>
<!-- img/og.png (1200×630) ve img/apple-touch-icon.png (180×180) bu sayfadan üretilir.
     Yeniden üretmek: python3 tools/gorsel-uret.py -->
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@600&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#111217;color:#DFE5EB}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;
    background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(239,35,60,.18),transparent 70%),#111217}
  .bd{position:absolute;left:-20px;bottom:-70px;font:400 330px/1 'Bebas Neue';letter-spacing:.02em;color:transparent;
    -webkit-text-stroke:2px rgba(239,35,60,.35);white-space:nowrap}
  .tag{position:absolute;top:64px;left:80px;font:600 20px 'JetBrains Mono';letter-spacing:.16em;color:#EF233C}
  .name{position:absolute;top:120px;left:80px;padding:14px 26px 0;background:#EF233C;color:#111217;font:400 150px/.9 'Bebas Neue';letter-spacing:.02em}
  .role{position:absolute;top:310px;left:80px;padding:12px 18px;border:1px solid rgba(255,255,255,.22);font:600 20px 'JetBrains Mono';letter-spacing:.12em}
  .role::before{content:'●';color:#EF233C;margin-right:12px}
  .lead{position:absolute;top:390px;left:80px;width:820px;font:500 30px/1.4 'Plus Jakarta Sans';color:#a3a3a3}
  .lead b{color:#fff;font-weight:700}
  .k{position:absolute;top:64px;right:80px;width:96px;height:96px;display:grid;place-items:center;border-radius:22px;background:#EF233C;color:#111217;font:400 64px 'Bebas Neue'}
  .icon{width:180px;height:180px;display:grid;place-items:center;background:#EF233C;color:#111217;font:400 132px/1 'Bebas Neue';padding-top:12px;box-sizing:border-box}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="bd">MINIKDEV</div>
  <div class="tag">// MINIK.DEV · BLOG</div>
  <div class="k">K</div>
  <div class="name">KAYRA</div>
  <div class="role">BİLGİSAYAR MÜHENDİSLİĞİ · DONANIM + YAZILIM</div>
  <div class="lead"><b>ESP32, iOS, macOS</b> ve gömülü sistemler üzerine proje günlükleri, hata kayıtları, ders notları.</div>
</div>
<div class="icon" id="icon">K</div>
<script>
  // ?ikon ile açılırsa sadece ikon görünür
  if (location.search.includes("ikon")) document.getElementById("og").remove();
  else document.getElementById("icon").remove();
</script>
</body>
</html>
